
services:
  # ─── Base de datos ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: consultorio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-consultorio_legal}
      POSTGRES_USER: ${POSTGRES_USER:-consultorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-consultorio123}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - consultorio-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-consultorio} -d ${POSTGRES_DB:-consultorio_legal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: consultorio_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    networks:
      - consultorio-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PgAdmin ─────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: consultorio_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@consultorio.co}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    volumes:
      - pgadmindata:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - consultorio-net
    depends_on:
      postgres:
        condition: service_healthy

  # ─── API (FastAPI) ────────────────────────────────────────────────────────────
  api:
    build:
      context: ./services/api          # contexto apunta al directorio del servicio
      dockerfile: ../../docker/api.Dockerfile
    container_name: consultorio_api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./services/api:/app            # hot-reload en desarrollo
    ports:
      - "8000:8000"
    networks:
      - consultorio-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Web (Next.js) ───────────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web              # contexto apunta al directorio de la app web
      dockerfile: ../../docker/web.Dockerfile
    container_name: consultorio_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY:-}
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    networks:
      - consultorio-net
    depends_on:
      - api

  # ─── Agente: Classifier ───────────────────────────────────────────────────────
  classifier-agent:
    build:
      context: ./services/classifier-agent
      dockerfile: ../../docker/agents.Dockerfile
    container_name: consultorio_classifier_agent
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./services/classifier-agent:/app
    ports:
      - "8001:8001"
    networks:
      - consultorio-net
    command: ["uvicorn", "agent:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

  # ─── Agente: Generación de Documentos ────────────────────────────────────────
  document-agent:
    build:
      context: ./services/document-agent
      dockerfile: ../../docker/agents.Dockerfile
    container_name: consultorio_document_agent
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./services/document-agent:/app
    ports:
      - "8002:8002"
    networks:
      - consultorio-net
    command: ["uvicorn", "agent:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]

  # ─── Agente: Monitor de Procesos ─────────────────────────────────────────────
  monitor-agent:
    build:
      context: ./services/monitor-agent
      dockerfile: ../../docker/agents.Dockerfile
    container_name: consultorio_monitor_agent
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./services/monitor-agent:/app
    ports:
      - "8003:8003"
    networks:
      - consultorio-net
    command: ["uvicorn", "agent:app", "--host", "0.0.0.0", "--port", "8003", "--reload"]

# ─── Redes ─────────────────────────────────────────────────────────────────────
networks:
  consultorio-net:
    driver: bridge
    name: consultorio-net

# ─── Volúmenes ─────────────────────────────────────────────────────────────────
volumes:
  pgdata:
    name: consultorio_pgdata
  redisdata:
    name: consultorio_redisdata
  pgadmindata:
    name: consultorio_pgadmindata
