version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cdl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: consultorio_legal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cdl_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: cdl_api
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/consultorio_legal
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    ports:
      - "8000:8000"

volumes:
  postgres_data:
